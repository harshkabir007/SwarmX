# Decentralized localization with slam_toolbox: every robot runs its OWN
# localization instance against a copy of the serialized pose graph (no
# shared server). Produce the graph once with slam_mapping.launch.py, then
#   ros2 service call /robot1/slam_toolbox/serialize_map slam_toolbox/srv/SerializePoseGraph "{filename: 'warehouse'}"
/**/slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: scan
    mode: localization
    map_file_name: ""            # set by launch (serialized pose graph, no extension)
    map_start_pose: [0.0, 0.0, 0.0]   # set by launch (spawn pose)
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
