# Per-robot localization + safety chain. Keys use the /** wildcard so the same
# file serves every robot namespace (each robot runs its own copy - nothing shared).
/**/map_server:
  ros__parameters:
    yaml_filename: ""          # set by launch
    topic_name: map
    frame_id: map

/**/amcl:
  ros__parameters:
    # Rack aisles are long featureless corridors: along the aisle only the few beams that look
    # straight down it constrain the pose. Trust the (good) wheel/IMU odometry and use all beams.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.35
    max_beams: 360
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    update_min_a: 0.1
    update_min_d: 0.05
    tf_broadcast: true
    transform_tolerance: 0.5
    save_pose_rate: 0.5
    set_initial_pose: true      # initial_pose set by launch (spawn pose)
    always_reset_initial_pose: false

/**/velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.0, 0.0, 2.5]
    min_velocity: [-0.5, 0.0, -2.5]
    max_accel: [1.5, 0.0, 4.0]
    max_decel: [-1.5, 0.0, -4.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
    enable_stamped_cmd_vel: false

/**/collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    # Last-resort guard below SwarmX's ORCA + safe-following layers. A predictive
    # "approach" footprint only reacts to what lies along the direction of travel,
    # so the shelf faces 0.5 m either side of a 1 m aisle never trip it.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: circle
      radius: 0.30
      action_type: approach
      time_before_collision: 0.8
      simulation_time_step: 0.05
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_approach
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: scan
      min_height: 0.0
      max_height: 1.0
      enabled: true
